<div class="meta">
    <ul class="meta__list">
        <li class="meta__item">
            {% assign author = site.data.authors[include.page.author] %}
            <a class="meta__author-link" href="{{ author.profileUrl }}"><img alt="Avatar" class="meta__author-avatar" src="{{ author.avatarUrl }}" /> {{ include.page.author }}</a>
        </li>
        <li class="meta__item">
            <time datetime="{{ include.page.date | date: '%Y-%m-%d' }}">{{ include.page.date | date: '%Y-%m-%d' }}</time>
        </li>
        {% if include.page.commentsUrl %}
            <li class="meta__item">
                <a class="meta__comments-link icon icon--after icon--forums" href="{{ include.page.commentsUrl }}">Comments</a>
            </li>
        {% endif %}
    </ul>
</div>
